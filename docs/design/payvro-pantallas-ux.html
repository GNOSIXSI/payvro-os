<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAYVRO Cloud · Pantallas y UX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Display:wght@500;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: banco de trabajo (indice a la izquierda, lienzo al centro) que enmarca el producto real en un contenedor con ancho de dispositivo. */
:root{
  color-scheme:light;
  --ink:#142B3B; --paper:#F5F3EC; --pet:#076B76; --pet-h:#055A63; --pet-soft:#E4F1F1;
  --teal:#00B8B2; --mag:#EF006D; --yel:#FFC400; --ora:#FF7900;
  --mut:#50636E; --line:#D7DEDE; --card:#FFFFFF; --bench:#E9E6DB; --field:#FBFAF6;
  --wait-bg:#FFF2C2; --wait-fg:#5A4300; --wait-bd:#E2BE45;
  --ok-bg:#D6F2F0; --ok-fg:#04575F; --ok-bd:#8ED6D2;
  --rev-bg:#FFE4CC; --rev-fg:#7A3500; --rev-bd:#F2B27A;
  --exp-bg:#E9ECEC; --exp-fg:#3F4F58; --exp-bd:#C3CCCC;
  --err:#A4241C; --err-bg:#FBE9E7;
  --hd:"Noto Sans Display","Noto Sans",system-ui,sans-serif;
  --bd:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --r-sm:8px; --ease:cubic-bezier(.2,.7,.2,1);
  --sh:0 1px 2px rgba(20,43,59,.06),0 8px 24px rgba(20,43,59,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bench);color:var(--ink);font-family:var(--bd);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--pet)}
h1,h2,h3,h4{font-family:var(--hd);font-weight:700;line-height:1.15;letter-spacing:-.01em;text-wrap:balance}
:focus-visible{outline:3px solid var(--pet);outline-offset:2px;border-radius:4px}
.dark :focus-visible{outline-color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.logo svg{display:block;height:100%;width:auto;aspect-ratio:787.963/160}
.iso svg{display:block;height:100%;width:auto;aspect-ratio:1}

/* ---------- banco de trabajo ---------- */
#bench{display:grid;grid-template-columns:264px 1fr;grid-template-rows:auto 1fr;height:100%}
#top{grid-column:1/-1;background:var(--ink);color:var(--paper);display:flex;align-items:center;gap:16px;padding:10px 16px;flex-wrap:wrap}
#top .logo{height:22px}
#top .ttl{font-size:14px;color:#C9D3D9}
#top .sp{flex:1}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:2px}
.seg button{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;color:#C9D3D9;min-height:32px}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
.ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:#C9D3D9}
#idx{background:#F0EDE3;border-right:1px solid var(--line);overflow:auto;padding:12px 8px}
#idx h2{font-size:12px;font-family:var(--bd);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px}
#idx a{display:flex;gap:10px;align-items:baseline;padding:8px;border-radius:var(--r-sm);text-decoration:none;color:var(--ink);font-size:14px}
#idx a:hover{background:#E6E2D6}
#idx a[aria-current=page]{background:var(--ink);color:var(--paper)}
#idx a .n{font-size:12px;color:var(--mut);width:18px;flex:none}
#idx a[aria-current=page] .n{color:#9FB1BC}
#idxsel{display:none}
#work{overflow:auto;padding:20px 24px 48px;min-width:0}
.whead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.whead h1{font-size:22px}
.whead .who{font-size:13px;color:var(--mut)}
.states{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.states .lab{font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.states button{font-size:13px;padding:5px 12px;border:1px solid #C9C5B7;border-radius:999px;background:#F7F5EE;min-height:32px}
.states button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.frame{margin:0 auto;background:var(--paper);border-radius:14px;box-shadow:var(--sh);overflow:hidden;border:1px solid #CFCBBE;transition:max-width .2s var(--ease)}
.frame[data-dev=desktop]{max-width:1200px}
.frame[data-dev=tablet]{max-width:820px}
.frame[data-dev=mobile]{max-width:390px;border-radius:28px;border:8px solid var(--ink)}
.stage{container-type:inline-size;container-name:st;min-height:560px;background:var(--paper);position:relative}
.notes{max-width:1200px;margin:20px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.notes div{background:#F7F5EE;border:1px solid #D9D5C8;border-left:4px solid var(--pet);border-radius:var(--r-sm);padding:10px 12px;font-size:14px}
.notes b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--pet);margin-bottom:2px}
@media (max-width:900px){
  #bench{grid-template-columns:1fr}
  #idx{display:none}
  #idxsel{display:block;background:var(--ink);color:var(--paper);border:1px solid rgba(255,255,255,.3);border-radius:var(--r-sm);padding:6px 8px;font-size:14px;max-width:100%}
  #work{padding:16px 16px 40px}
}

/* ---------- componentes del producto ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:15px;background:var(--pet);color:#fff;border:1px solid var(--pet);text-decoration:none;transition:background .16s var(--ease)}
.btn:hover{background:var(--pet-h)}
.btn.sec{background:#fff;color:var(--pet)}
.btn.sec:hover{background:var(--pet-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pet)}
.btn.ghost:hover{background:var(--pet-soft)}
.btn.danger{background:#fff;color:var(--err);border-color:#D9A19C}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.lg{min-height:52px;font-size:17px;padding:12px 22px}
.btn.block{width:100%}
.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.b-wait{background:var(--wait-bg);color:var(--wait-fg);border-color:var(--wait-bd)}
.b-ok{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
.b-lib{background:var(--pet);color:#fff}
.b-rev{background:var(--rev-bg);color:var(--rev-fg);border-color:var(--rev-bd)}
.b-exp{background:var(--exp-bg);color:var(--exp-fg);border-color:var(--exp-bd)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;padding:2px 7px;border-radius:6px;background:var(--ink);color:#fff;text-transform:uppercase;vertical-align:middle}
.tag.pro{background:var(--pet)}
.tag.out{background:#fff;color:var(--ink);border:1px solid var(--line)}
.tag.demo{background:var(--yel);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.fld .hint{font-weight:400;color:var(--mut);font-size:13px}
.fld .err{font-weight:600;color:var(--err);font-size:13px;display:flex;gap:6px;align-items:center}
.inp{min-height:44px;padding:10px 12px;border:1px solid #B9C4C4;border-radius:var(--r-sm);background:var(--field);font-weight:400;font-size:16px;width:100%}
.inp[aria-invalid=true]{border-color:var(--err);background:var(--err-bg)}
.inp.big{font-family:var(--hd);font-size:28px;font-weight:700}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.mut{color:var(--mut)}.small{font-size:13px}.sp{flex:1}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:#fff;font-size:14px}
.alert.rev{background:var(--rev-bg);border-color:var(--rev-bd);color:var(--rev-fg)}
.alert.err{background:var(--err-bg);border-color:#E2B1AC;color:var(--err)}
.alert.info{background:var(--pet-soft);border-color:#B5D8D9;color:#04474E}
.alert svg.i{margin-top:3px}
.demo-bar{background:var(--ink);color:var(--paper);font-size:13px;padding:6px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 12px;font-size:14px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;min-height:44px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--pet)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid #ECEEEE;vertical-align:middle}
td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.qr{background:#fff;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;display:inline-block;line-height:0}
.qr svg{display:block;width:100%;height:auto}

/* shell de la app del dueno */
.app{display:grid;grid-template-columns:208px 1fr;min-height:640px}
.side{background:var(--ink);color:#C9D3D9;padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.side .logo{height:20px;margin:4px 8px 18px}
.side button{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r-sm);font-size:15px;color:#C9D3D9;text-align:left;min-height:40px}
.side button:hover{background:rgba(255,255,255,.08)}
.side button[aria-current=page]{background:rgba(255,255,255,.14);color:#fff;font-weight:600}
.side .foot{margin-top:auto;font-size:12px;padding:8px;color:#9FB1BC}
.main{min-width:0;display:flex;flex-direction:column}
.bar{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff;flex-wrap:wrap}
.bar .biz{display:flex;gap:10px;align-items:center;font-weight:600}
.av{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--hd);font-weight:700;flex:none}
.body{padding:20px;display:flex;flex-direction:column;gap:16px}
.body h2{font-size:24px}
.tabbar{display:none}
.kpis .card{padding:14px 16px}
.kpis .v{font-family:var(--hd);font-weight:700;font-size:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid #B9C4C4;background:#fff;min-height:36px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rowbtn{display:contents}
tr.click{cursor:pointer}
tr.click:hover td{background:#F4F7F7}
.clist{display:none;flex-direction:column;gap:8px}
.clist button{text-align:left;display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.tl{list-style:none;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding-bottom:16px;position:relative}
.tl li::before{content:"";position:absolute;left:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--pet);color:#fff}
.tl li.cur .dot{background:var(--wait-bg);color:var(--wait-fg);border:1px solid var(--wait-bd)}
.tl li.rev .dot{background:var(--rev-bg);color:var(--rev-fg);border:1px solid var(--rev-bd)}
.tl li.exp .dot{background:var(--exp-bg);color:var(--exp-fg);border:1px solid var(--exp-bd)}
.tl li.todo .dot{background:#fff;border:2px dashed #B9C4C4;color:var(--mut)}
.tl li.todo{color:var(--mut)}
.tl b{display:block}
.tl span.t{font-size:13px;color:var(--mut)}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--mut)}
.kv dd{font-weight:600;text-align:right}
.steps{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);flex-wrap:wrap}
.steps span{display:inline-flex;gap:6px;align-items:center}
.steps i{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:12px;border:1px solid #B9C4C4;background:#fff;color:var(--mut)}
.steps .on{color:var(--ink);font-weight:600}.steps .on i{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps .ok i{background:var(--pet);color:#fff;border-color:var(--pet)}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid #B9C4C4;border-radius:var(--r);padding:14px;background:#fff;width:100%}
.opt[aria-pressed=true],.opt[aria-checked=true]{border-color:var(--pet);box-shadow:inset 0 0 0 1px var(--pet);background:var(--pet-soft)}
.opt b{display:block}.opt span{font-size:13px;color:var(--mut)}
.center{max-width:520px;margin:0 auto;padding:32px 20px;display:flex;flex-direction:column;gap:16px}
.sw{display:flex;gap:8px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #B9C4C4}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--ink)}
.plan{display:flex;flex-direction:column;gap:10px}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plan li{display:flex;gap:8px;align-items:flex-start}
.plan li svg.i{color:var(--pet);margin-top:3px}
.plan.cur{border:2px solid var(--pet)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:68px;border-radius:var(--r);background:#fff;border:1px solid #B9C4C4;font-family:var(--hd);font-weight:700;font-size:26px}
.pad button:active{background:var(--pet-soft)}
.amt{font-family:var(--hd);font-weight:700;font-size:56px;line-height:1.05}
.lock{position:relative}
.overlay{position:fixed;inset:0;background:rgba(20,43,59,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:#fff;border-radius:16px;padding:24px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(20,43,59,.35)}
.dlg h3{font-size:22px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px);text-align:center}
.pulse{width:10px;height:10px;border-radius:50%;background:currentColor;animation:pl 1.2s ease-out infinite}
@keyframes pl{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pet);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* landing */
.ld-nav{display:flex;gap:20px;align-items:center;padding:16px 32px;background:var(--paper);border-bottom:1px solid var(--line)}
.ld-nav .logo{height:26px}
.ld-nav a.l{font-size:15px;color:var(--ink);text-decoration:none;font-weight:600}
.ld-sec{padding:56px 32px;max-width:1120px;margin:0 auto}
.ld-sec h2{font-size:34px;max-width:720px;margin-bottom:8px}
.ld-sec .lead{font-size:18px;color:var(--mut);max-width:680px;margin-bottom:24px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pet);margin-bottom:8px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:56px}
.hero p.lead{font-size:19px;color:var(--mut);margin:16px 0 24px;max-width:560px}
.kn{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--hd);font-weight:700;color:var(--ink);flex:none}
.k1{background:var(--teal)}.k2{background:var(--mag);color:#fff}.k3{background:var(--yel)}.k4{background:var(--ora)}
.band{background:var(--ink);color:var(--paper)}
.band .mut{color:#C9D3D9}
.chat{background:#EFEBE0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chat .h{background:var(--ink);color:#fff;padding:10px 14px;font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.chat .m{padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:84%;padding:8px 14px;border-radius:12px;font-size:15px;background:#fff;border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:#DDE8D6;border-color:#C5D5BC}
.shot{margin-top:6px;border:1px dashed #9AA4A8;border-radius:8px;height:64px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#5B6870;background:repeating-linear-gradient(0deg,#F4F4F1 0 10px,#EBEBE6 10px 12px)}
details.faq{border-bottom:1px solid var(--line);padding:14px 0}
details.faq summary{font-family:var(--hd);font-weight:700;font-size:18px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-size:22px;line-height:1;color:var(--pet)}
details.faq[open] summary::after{content:"–"}
details.faq p{margin-top:8px;color:var(--mut);max-width:680px}

/* ---------- respuesta al ancho del contenedor (escritorio / tablet / movil) ---------- */
@container st (max-width:860px){
  .g4{grid-template-columns:1fr 1fr}
  .hero{grid-template-columns:1fr}
  .split{grid-template-columns:1fr}
  .ld-nav a.l{display:none}
}
@container st (max-width:600px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);margin-top:auto}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:8px 2px;color:var(--mut);min-height:52px}
  .tabbar button[aria-current=page]{color:var(--pet);font-weight:700}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpis .card:first-child{grid-column:1/-1}
  .body{padding:16px}
  .bar{padding:10px 16px}
  .tw.resp{display:none}
  .clist{display:flex}
  .hero h1{font-size:38px}
  .ld-sec{padding:36px 16px}
  .ld-sec h2{font-size:28px}
  .ld-nav{padding:12px 16px;gap:10px}
  .ld-nav .hide-m{display:none}
  .amt{font-size:44px}
  .body h2{font-size:22px}
  .bar .hide-m{display:none}
}

.sk{display:block;border-radius:6px;background:#DDE2E2;animation:pl 1.2s ease-out infinite}
::placeholder{color:#5F7079;opacity:1}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--pet);flex:none}
.tag.pv{background:#fff;color:var(--rev-fg);border:1px dashed #C77A3A}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.tw:focus-visible{outline-offset:-2px}
.split>*,.grid>*,.app>*{min-width:0}
.kn{font-size:19px}
.alert.neu{background:var(--exp-bg);border-color:var(--exp-bd);color:var(--exp-fg)}
.center>.badge,.center>.tag{align-self:flex-start}
.ld-nav a.l{padding:10px 4px}
</style>
</head>
<body>

var ORDER=['indice','landing','acceso','onboarding','panel','nuevo-cobro','detalle','pago','revision','plantillas','plan','ajustes','mostrador','os'];

/* ---------- render ---------- */
var work,idx,idxsel,lastRoute=null,toastT=null,timer=null;
function render(){
  var r=R[S.route],act=document.activeElement,fid=act&&act.id,n=ORDER.indexOf(S.route),o='';
  o+='<div class="whead"><h1 id="scr-title" tabindex="-1">'+(n?(n<10?'0':'')+n+' · ':'')+r.t+'</h1><span class="who">'+r.who+'</span></div>';
  if(r.states.length>1){o+='<div class="states" role="group" aria-label="Estados de esta pantalla"><span class="lab">Estados</span>';
    r.states.forEach(function(s){o+='<button type="button" id="st-'+s[0]+'" aria-pressed="'+(sub()===s[0])+'" data-st="'+s[0]+'">'+s[1]+'</button>';});o+='</div>';}
  o+='<div class="frame" data-dev="'+(S.route==='indice'?'desktop':S.device)+'"><div class="stage" id="stage">'+r.v()+vDialog()+(S.toast?'<div class="toast" role="status">'+h(S.toast)+'</div>':'')+'</div></div>';
  if(r.notes.length){o+='<section class="notes" aria-label="Lógica de UX">';r.notes.forEach(function(x){o+='<div><b>'+x[0]+'</b>'+x[1]+'</div>';});o+='</section>';}
  work.innerHTML=o;
  var nav='<h2>Pantallas</h2>',opts='';
  ORDER.forEach(function(k,i){nav+='<a href="#'+k+'"'+(k===S.route?' aria-current="page"':'')+'><span class="n">'+(i?(i<10?'0':'')+i:'')+'</span>'+R[k].t+'</a>';opts+='<option value="'+k+'"'+(k===S.route?' selected':'')+'>'+(i?i+'. ':'')+R[k].t+'</option>';});
  idx.innerHTML=nav;idxsel.innerHTML=opts;
  [['edseg','ed',S.os?'os':'cloud'],['devseg','dev',S.device],['planseg','plan',S.plan],['demoseg','demo',S.demo?'1':'0']].forEach(function(g){
    [].forEach.call(document.getElementById(g[0]).querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-'+g[1])===g[2]));});});
  if(S.dialog){var dk=document.getElementById('dlg-ok');if(dk)dk.focus();}
  else if(S.route==='acceso'&&sub()==='codigo'&&fid==='ac-go'){var cf=document.getElementById('ac-code');if(cf)cf.focus();}
  else if(lastRoute!==S.route){if(lastRoute!==null){document.getElementById('scr-title').focus();work.scrollTop=0;}}
  else if(fid){var el=document.getElementById(fid);if(el)el.focus();}
  lastRoute=S.route;
}
function narrow(){return !!(window.matchMedia&&window.matchMedia('(max-width:900px)').matches);}
function go(route,st){
  if(!R[route])route='indice';
  if(route!==S.route&&R[route].dev)S.device=R[route].dev;
  else if(route!==S.route&&(S.route==='pago'||S.route==='mostrador'))S.device=narrow()?'mobile':'desktop';
  if(route!==S.route){S.revDone=null;S.revClosed=false;}
  S.route=route;if(st)S.sub[route]=st;S.dialog=null;
  if(location.hash!=='#'+route){try{location.hash=route;}catch(e){}}
  render();
}
function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(function(){S.toast=null;var e=document.querySelector('.toast');if(e)e.remove();},3600);}
function later(ms,fn){clearTimeout(timer);timer=setTimeout(fn,ms);}
function speak(kind){var t=kind==='rev'?'Revisa este pago':'Recibiste '+padAmt().toFixed(2).replace('.00','')+' pesos';
  try{var u=new SpeechSynthesisUtterance(t);u.lang='es-MX';window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}catch(e){}}
function resetData(){var c=ch('#128');c.st='liberado';c.at='09:47';ch('#131').st='esperando';S.first=false;}

var ACT={
  toast:function(el){toast(el.getAttribute('data-msg'));},
  tour:function(){resetData();S.os=false;S.plan='gratis';go('acceso','registro');},
  reset:function(){resetData();S.os=false;S.connect=null;S.sub={};go('acceso','registro');},
  'start-onb':function(){S.first=true;S.demo=true;S.connect=null;go('onboarding','giro');},
  giro:function(el){S.biz.giro=el.getAttribute('data-v');var t=tplBy(el.getAttribute('data-t'));if(t[3]==='base')S.tplFree=t[0];render();},
  color:function(el){S.biz.color=el.getAttribute('data-v');render();},
  pick:function(el){var p=el.parentNode;[].forEach.call(p.querySelectorAll('[data-act=pick]'),function(b){b.setAttribute('aria-pressed',String(b===el));});},
  'finish-onb':function(){S.tpl=S.tplFree;if(S.tpl==='mostrador')go('mostrador','teclado');else go('nuevo-cobro','formulario');},
  'connect-key':function(){S.sub.onboarding='pey-verificando';render();later(900,function(){S.demo=false;S.connect='key';if(S.route==='onboarding'){S.sub.onboarding='pey-ok';render();}});},
  'connect-alta':function(){var v=(document.getElementById('al-clabe')||{}).value||'';if(v.replace(/\D/g,'').length!==18){S.sub.onboarding='alta-error';render();var f=document.getElementById('al-clabe');if(f)f.focus();return;}S.demo=true;S.connect='alta';S.sub.onboarding='validacion';render();},
  filter:function(el){S.filter=el.getAttribute('data-v');if(el.getAttribute('data-st'))S.sub.panel='hoy';render();},
  open:function(el){var c=ch(el.getAttribute('data-id'));S.sel=c.id;go('detalle',c.st);},
  tpl:function(el){var v=el.getAttribute('data-v'),l=lockOf(tplBy(v));if(l==='swap'){S.pendTpl=v;S.dialog='cambiar-plantilla';}else if(l){S.dialog=l==='pro'?'up-plantilla':'up-business';}else{S.tpl=v;S.sub['nuevo-cobro']='formulario';}render();},
  'tpl-go':function(el){S.tpl=el.getAttribute('data-v');if(S.tpl==='mostrador')go('mostrador','teclado');else go('nuevo-cobro','formulario');},
  'swap-ask':function(el){S.pendTpl=el.getAttribute('data-v');S.dialog='cambiar-plantilla';render();},
  'swap-do':function(){S.tplFree=S.pendTpl;S.tpl=S.pendTpl;S.dialog=null;toast('Listo: tu plantilla gratis ahora es '+tplBy(S.tplFree)[1]+'.');},
  rules:function(el){S.ruleTpl=el.getAttribute('data-v');go('plantillas','reglas');},
  create:function(){
    var a=document.getElementById('nc-amt'),v=parseFloat(String(a?a.value:'').replace(/[^0-9.]/g,''));
    if(!(v>0)){S.sub['nuevo-cobro']='error';render();var f=document.getElementById('nc-amt');if(f)f.focus();return;}
    var con=(document.getElementById('nc-con')||{}).value||'Sin concepto',tel=(document.getElementById('nc-tel')||{}).value||'';
    S.sub['nuevo-cobro']='creando';render();
    later(700,function(){
      var c;
      if(S.first&&S.tpl==='pedido'){c=ch('#128');c.amt=v;c.con=con;c.st='esperando';c.at='11:24';c.tel=tel;}
      else{c={id:'#'+(127+S.charges.length),k:S.tpl,tpl:{pedido:'Pedido',cita:'Anticipo de cita',cotizacion:'Cotización',membresia:'Membresía'}[S.tpl],con:con,amt:v,st:'esperando',at:'11:24',tel:tel};S.charges.unshift(c);}
      S.sel=c.id;if(S.route==='nuevo-cobro'){S.sub['nuevo-cobro']='listo';render();}
    });
  },
  copy:function(el){var v=el.getAttribute('data-v');try{navigator.clipboard.writeText(v).then(function(){},function(){});}catch(e){}toast('Copiado: '+v);},
  whatsapp:function(){if(S.os&&!S.osWa){S.dialog='os-wa';render();return;}if(S.plan==='gratis'){S.dialog='up-whatsapp';render();}else toast('Link enviado por WhatsApp.');},
  dialog:function(el){S.dialog=el.getAttribute('data-d');render();},
  'dlg-close':function(){S.dialog=null;render();},
  'dlg-bg':function(el,ev){if(ev.target===el){S.dialog=null;render();}},
  'dlg-done':function(el){var was=S.dialog;S.dialog=null;
    if(was==='cerrar'&&S.route==='mostrador'){S.sub.mostrador='teclado';toast('Cobro cerrado sin liberar. Si alguien paga ese QR, entra a En revisión · pago tardío.');return;}
    if(was==='cerrar'&&S.route==='detalle'){var c=ch(S.sel);c.st='cerrado';c.reason='El dueño dejó de esperarlo';c.by='Ana López (dueña)';c.got=null;c.ref=false;c.closedAt='Hoy 11:30';S.sub.detalle='cerrado';toast('Cobro cerrado sin liberar. Quedó en la bitácora.');return;}
    toast(el.getAttribute('data-msg'));},
  'dlg-plan':function(el){S.plan=el.getAttribute('data-p');S.dialog=null;toast('Listo, ahora estás en '+PLAN_N[S.plan]+'. (Prototipo: aquí va el pago de la suscripción.)');},
  setplan:function(el){S.plan=el.getAttribute('data-p');toast('Plan cambiado a '+PLAN_N[S.plan]+'. (Prototipo: aquí va el pago de la suscripción.)');},
  release:function(){var c=ch(S.sel);c.st='liberado';S.sub.detalle='liberado';toast('Liberado. Avisamos a tu cliente.');},
  rev:function(el){var v=el.getAttribute('data-v'),c=ch(sub()==='tardio'?'#127':'#129');
    if(v==='reject'){S.dialog='no-liberar';render();return;}
    S.revDone=v==='diff'?'Creamos un cobro nuevo por '+money(c.amt-(c.got||0))+'. Este se libera cuando el nuevo quede verificado.':'Liberado con lo recibido.';render();},
  'rev-reject':function(){var r=document.getElementById('dlg-ref');S.revClosed=true;S.revDone='El cobro pasó a «Cerrado sin liberar».'+(r&&r.checked?' Anotaste «devolución hecha por fuera».':' Sin devolución anotada; la puedes anotar después.');S.dialog=null;render();},
  'rev-reset':function(){S.revDone=null;S.revClosed=false;render();},
  simpay:function(){S.sub.pago='verificando';render();later(1100,function(){var c=ch(S.sel);if(c.st!=='esperando'){c=ch('#131');S.sel=c.id;}c.st=c.k==='cotizacion'?'verificado':'liberado';S.first=false;if(S.route==='pago'){S.sub.pago='exito';render();}});},
  pad:function(el){var k=el.getAttribute('data-v');if(k==='del')S.pad=S.pad.slice(0,-1);else if((S.pad+k).length<=8)S.pad=(S.pad+k).replace(/^0+/,'');render();},
  'pad-go':function(){if(padAmt()>0){S.sub.mostrador='qr';render();}},
  'pad-pay':function(){S.sub.mostrador='recibido';render();speak('ok');},
  'pad-new':function(){S.pad='';S.sub.mostrador='teclado';render();},
  speak:function(el){speak(el.getAttribute('data-v'));},
  'os-wa':function(){S.osWa=!S.osWa;toast(S.osWa?'WhatsApp conectado con tu número. (Prototipo: aquí va el alta del número.)':'WhatsApp desconectado.');},
  'os-model':function(){S.osModel=!S.osModel;toast(S.osModel?'Modelo conectado. (Prototipo: aquí pegas la llave de tu modelo.)':'Modelo desconectado.');},
  'set-os':function(){S.os=true;S.plan='business';render();},
  'os-key':function(){S.sub.os='verificando';render();later(900,function(){S.demo=false;S.connect='key';if(S.route==='os'){S.sub.os='listo';render();}});},
  'os-start':function(el){S.os=true;S.plan='business';S.demo=el.getAttribute('data-v')==='1';S.first=true;S.tpl='pedido';go('nuevo-cobro','formulario');}
};

function init(){
  work=document.getElementById('work');idx=document.getElementById('idx');idxsel=document.getElementById('idxsel');
  document.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-scroll]');
    if(t){ev.preventDefault();var sec=document.getElementById('sec-'+t.getAttribute('data-scroll'));if(sec)sec.scrollIntoView({block:'start'});return;}
    t=ev.target.closest('[data-dev],[data-plan],[data-demo],[data-ed]');
    if(t&&t.closest('#top')){if(t.hasAttribute('data-ed')){S.os=t.getAttribute('data-ed')==='os';if(S.os)S.plan='business';}if(t.hasAttribute('data-plan'))S.os=false;if(t.hasAttribute('data-dev'))S.device=t.getAttribute('data-dev');if(t.hasAttribute('data-plan'))S.plan=t.getAttribute('data-plan');if(t.hasAttribute('data-demo'))S.demo=t.getAttribute('data-demo')==='1';render();return;}
    t=ev.target.closest('[data-act],[data-go],[data-st]');
    if(!t||t.getAttribute('aria-disabled')==='true')return;
    if(t.hasAttribute('data-act')){ACT[t.getAttribute('data-act')](t,ev);return;}
    if(t.hasAttribute('data-go')){go(t.getAttribute('data-go'),t.getAttribute('data-st'));return;}
    if(t.hasAttribute('data-st')){clearTimeout(timer);S.sub[S.route]=t.getAttribute('data-st');S.dialog=null;S.revDone=null;render();}
  });
  document.addEventListener('change',function(ev){var b=ev.target.getAttribute&&ev.target.getAttribute('data-bind');if(b==='name'){S.biz.name=ev.target.value.trim()||'Tu negocio';render();}});
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'&&S.dialog){S.dialog=null;render();return;}
    if(ev.key==='Tab'&&S.dialog){var f=document.querySelectorAll('.dlg button,.dlg input');if(!f.length)return;var a=f[0],z=f[f.length-1];if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus();}else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus();}return;}
    if(ev.key==='Enter'&&ev.target.id==='nc-amt'){ACT.create();return;}
    var role=ev.target.getAttribute&&ev.target.getAttribute('role');
    if((role==='tab'||role==='radio')&&/^Arrow/.test(ev.key)){
      var grp=[].slice.call(ev.target.parentNode.querySelectorAll('[role='+role+']')),i=grp.indexOf(ev.target),d=(ev.key==='ArrowRight'||ev.key==='ArrowDown')?1:-1,nx=grp[(i+d+grp.length)%grp.length];
      ev.preventDefault();var id=nx.id;nx.click();var e2=document.getElementById(id);if(e2)e2.focus();
    }
  });
  idxsel.addEventListener('change',function(){go(idxsel.value);});
  window.addEventListener('hashchange',function(){var k=(location.hash||'').slice(1);if(k&&k!==S.route&&R[k])go(k);});
  var k=(location.hash||'').slice(1);
  if(k&&R[k]){S.route=k;if(R[k].dev)S.device=R[k].dev;}
  if(narrow()&&S.device==='desktop')S.device='mobile';
  render();
}
if(typeof document!=='undefined')init();
if(typeof module!=='undefined')module.exports={S:S,R:R,ORDER:ORDER,vDialog:vDialog,DLG:DLG};
})();
</script>
</body>
</html>
